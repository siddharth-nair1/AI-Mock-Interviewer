<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Call</title>
    <style>
        :root {
            --bg-dark: #1a1a1a;
            --panel-bg: #2d2d2d;
            --control-bg: #333;
            --primary: #0b5cff;
            --danger: #ff4444;
            --text-light: #fff;
        }

        body {
            margin: 0;
            background-color: black;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-light);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Setup Modal */
        #setupModal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: #1e1e1e;
            padding: 2rem;
            border-radius: 12px;
            width: 400px;
            text-align: center;
            border: 1px solid #333;
        }

        input[type="file"] {
            background: #333;
            color: white;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            margin: 10px 0;
            border: 1px solid #444;
        }

        /* Main Video Area */
        .video-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr;
            position: relative;
            background: #121212;
        }

        /* AI Avatar (Main View) */
        .interviewer-view {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .avatar-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #444;
            overflow: hidden;
            border: 3px solid #666;
            position: relative;
            transition: all 0.2s;
        }

        .avatar-circle.speaking {
            border-color: #0b5cff;
            box-shadow: 0 0 30px rgba(11, 92, 255, 0.4);
            transform: scale(1.05);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .interviewer-name {
            margin-top: 1rem;
            font-size: 1.2rem;
            font-weight: 500;
        }

        .status-badge {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #888;
            background: rgba(0,0,0,0.3);
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* User Video (PIP) */
        .user-view {
            position: absolute;
            bottom: 100px;
            right: 20px;
            width: 280px;
            height: 160px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror effect */
        }

        /* Subtitles / Chat Overlay */
        .captions {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1.1rem;
            max-width: 80%;
            text-align: center;
            display: none;
        }

        /* Bottom Control Bar */
        .controls-bar {
            height: 80px;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            border-top: 1px solid #333;
        }

        .btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: #333;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn:hover { background: #444; }
        
        .btn.primary { background: var(--primary); }
        .btn.primary:hover { background: #004ad7; }
        
        .btn.danger { background: var(--danger); }
        .btn.danger:hover { background: #cc0000; }

        .btn.active {
            background: white;
            color: black;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Setup Modal -->
    <div id="setupModal">
        <div class="modal-content">
            <h2>💼 Pre-Interview Setup</h2>
            <p style="color:#aaa; font-size:0.9rem">Upload your resume & job description</p>
            
            <input type="file" id="resume" accept=".pdf,.txt">
            <input type="file" id="jd" accept=".pdf,.txt">
            
            <button onclick="startInterview()" class="btn primary" style="width:100%; border-radius:8px; margin-top:10px;">
                Start Interview
            </button>
            <p id="status" style="margin-top:10px; font-size:0.8rem; color:#aaa"></p>
        </div>
    </div>

    <!-- Main Call Interface -->
    <div class="video-grid">
        <!-- Interviewer (AI) -->
        <div class="interviewer-view">
            <div class="avatar-circle" id="aiAvatar">
                <!-- Placeholder Avatar -->
                <img src="https://ui-avatars.com/api/?name=AI+Interviewer&background=0D8ABC&color=fff&size=150" class="avatar-img">
            </div>
            <div class="interviewer-name">Sarah (Interviewer)</div>
            <div class="status-badge" id="aiStatus">Connecting...</div>
        </div>

        <!-- Captions -->
        <div class="captions" id="captions"></div>

        <!-- User Video (PIP) -->
        <div class="user-view">
            <video id="userVideo" autoplay muted playsinline></video>
            <div style="position:absolute; bottom:5px; left:10px; font-size:0.8rem; background:rgba(0,0,0,0.5); padding:2px 5px; border-radius:4px;">You</div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls-bar">
        <button class="btn" onclick="toggleMute()" id="muteBtn">🎤</button>
        <!-- <button class="btn" onclick="toggleVideo()">📷</button> -->
        <button class="btn primary" id="talkBtn" onclick="toggleTalking()">
            🎙️ Tap to Speak
        </button>
        <button class="btn danger" onclick="location.reload()">📞</button>
    </div>

    <audio id="audioPlayer" style="display:none"></audio>

    <script>
        const API_BASE = window.location.protocol === 'file:' ? "http://127.0.0.1:8000" : "";
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        // Initialize User Camera
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('userVideo').srcObject = stream;
            } catch (e) {
                console.error("Camera error:", e);
                alert("Please enable camera access for the interview.");
            }
        }
        initCamera();

        async function startInterview() {
            const resume = document.getElementById('resume').files[0];
            const jd = document.getElementById('jd').files[0];
            const status = document.getElementById('status');

            if (!resume || !jd) {
                status.innerText = "Please upload both files";
                status.style.color = "#ff4444";
                return;
            }

            status.innerText = "Analyzing profile... (This takes ~30s)";
            
            const formData = new FormData();
            formData.append('resume', resume);
            formData.append('job_description', jd);

            try {
                const res = await fetch(`${API_BASE}/upload`, {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });
                const data = await res.json();

                if (data.status === 'success') {
                    document.getElementById('setupModal').classList.add('hidden');
                    updateStatus("Speaking...");
                    showCaption(data.question);
                    playAudio(data.audio_url);
                } else {
                    status.innerText = "Error: " + data.message;
                }
            } catch (e) {
                status.innerText = "Connection Error";
            }
        }

        async function toggleTalking() {
            const btn = document.getElementById('talkBtn');
            const status = document.getElementById('aiStatus');

            if (!isRecording) {
                // START RECORDING
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => submitAnswer();

                    mediaRecorder.start();
                    isRecording = true;
                    btn.classList.add('danger'); // Turn red
                    btn.innerText = "⏹️ Stop & Send";
                    updateStatus("Listening to you...");
                    document.getElementById('aiAvatar').style.opacity = "0.5";
                } catch (e) {
                    alert("Mic error");
                }
            } else {
                // STOP RECORDING
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('danger');
                btn.innerText = "🎙️ Tap to Speak";
                updateStatus("Thinking...");
                document.getElementById('aiAvatar').style.opacity = "1";
            }
        }

        async function submitAnswer() {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            if (blob.size < 100) return;

            const formData = new FormData();
            formData.append('audio', blob, 'answer.webm');

            try {
                const res = await fetch(`${API_BASE}/answer`, {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });
                const data = await res.json();

                if (data.error) {
                    alert("Error: " + data.error);
                } else {
                    showCaption(data.interviewer_response);
                    playAudio(data.audio_url);
                }
            } catch (e) {
                console.error(e);
            }
        }

        function playAudio(url) {
            const audio = document.getElementById('audioPlayer');
            const avatar = document.getElementById('aiAvatar');
            
            audio.src = `${API_BASE}${url}?t=${Date.now()}`;
            
            updateStatus("Speaking...");
            avatar.classList.add('speaking');
            
            audio.play().catch(e => console.error("Autoplay blocked", e));

            audio.onended = () => {
                avatar.classList.remove('speaking');
                updateStatus("Waiting for your response...");
            };
        }

        function updateStatus(text) {
            document.getElementById('aiStatus').innerText = text;
        }

        function showCaption(text) {
            const cap = document.getElementById('captions');
            cap.style.display = 'block';
            cap.innerText = text;
            setTimeout(() => { cap.style.display = 'none'; }, 8000);
        }

        function toggleMute() {
            alert("Mute toggled (Visual only for now)");
        }
    </script>
</body>
</html>
